[platformio]
build_cache_dir = .cache
default_envs = example-fusb302_rtos_esp32c3_arduino

[env]
build_flags =
  -Wall
  -Wextra
  -std=gnu++17
build_src_flags =
  #-Wconversion
  -Wfloat-conversion
lib_deps =
  https://github.com/ETLCPP/etl#20.48.1


[env:example-fusb302_rtos_esp32c3_arduino]
platform = espressif32 @ 8.0.0
framework = arduino
board = lolin_c3_mini
upload_protocol = esp-builtin
debug_tool = esp-builtin
test_ignore = *
build_flags =
  ${env.build_flags}
  # Make path with pd_config.h searchable
  -I $PROJECT_DIR/src
  -D PD_USE_CONFIG_FILE
  # Arduino core 3.x does not pass -Os to PlatformIO builds
  -Os
build_unflags =
  -std=gnu++11
lib_deps =
  ${env.lib_deps}
  pdsink = symlink://../../
  https://github.com/pdsink/jetlog#2f69d2bb7e041b15470b99768d2c88205528ce8c
  codewitch-honey-crisis/htcw_rmt_led_strip @ 0.2.2

[env:example-fusb302_rtos_esp32c3_espidf]
extends = env:example-fusb302_rtos_esp32c3_arduino
framework = espidf
board_build.esp-idf.sdkconfig_path = ${PROJECT_DIR}/sdkconfig.generated
board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS=${PROJECT_DIR}/sdkconfig.override
